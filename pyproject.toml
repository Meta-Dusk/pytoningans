[project]
name = "pytoningans"
version = "0.8.5"
description = "A PySide6 Desktop Idler Sandbox Game"
readme = "README.md"
authors = [{ name = "MetaDusk", email = "andredcxxv@gmail.com" }]
requires-python = ">=3.14"
dependencies = ["pyside6>=6.11.2,<6.12.0"]

[project.scripts]
pytoningans = "pytoningans:main"
build = "tools.build:main"
bump-version = "tools.bump_version:main"
export-cloud-config = "tools.export_cloud_config:main"

[dependency-groups]
dev = ["nuitka>=4.3.1", "pip>=26.2.2"]
docs = [
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
    "ruff>=0.17.3",
]

[tool.uv]
default-groups = ["docs", "dev"]

[tool.uv.build-backend]
module-name = ["pytoningans", "tools"]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
