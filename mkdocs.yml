site_name: PyToNingans
site_description: A PySide6 Desktop Idler Sandbox Game & Community Modding Ecosystem
site_author: MetaDusk
site_url: https://meta-dusk.github.io/pytoningans/
repo_name: Meta-Dusk/pytoningans
repo_url: https://github.com/Meta-Dusk/pytoningans
copyright: "Copyright &copy; 2026 MetaDusk - Open Source under MIT License"

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/favicon.ico
  language: en
  palette:
    # Palette toggle for dark mode (default)
    - scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    # Palette toggle for light mode
    - scheme: default
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Outfit
    code: Pixel Code
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    # - navigation.expand
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - navigation.path
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
    # - toc.integrate

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            heading_level: 2
            line_length: 60
            docstring_style: google
            docstring_section_style: table
            members_order: source
            inherited_members: true
            group_by_category: true
            show_root_heading: true
            show_root_full_path: false
            show_root_toc_entry: false
            show_object_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_source: true
            show_signature_annotations: true
            show_if_no_docstring: true
            signature_crossrefs: true
            separate_signature: true
            unwrap_annotated: true

nav:
  - Home:
      - Overview: index.md
      - About: about.md
  - Getting Started:
      - Installation & Setup: getting-started/installation.md
      - Building & Requirements: getting-started/building.md
      - Quickstart Guide: getting-started/quickstart.md
  - User Guide:
      - Desktop Window Physics: user-guide/desktop-physics.md
      - Combat & Visual Feedback: user-guide/combat-visuals.md
      - Settings & Developer Tools: user-guide/settings.md
  - Modding:
      - Mod Architecture & Config: modding/mod-structure.md
      - Modpacks & Shared Controllers: modding/creating-packs.md
      - Security Audit & AST Sandbox: modding/inspector-audit.md
      - Community Hub & Cloud Publishing: modding/publishing.md
      - Behaviors:
          - Standalone:
              - Start: modding/behaviors/standalone/start.md
              - Example Implementations: modding/behaviors/standalone/examples.md
          - Packs:
              - Example Implementations: modding/behaviors/packs/examples.md
  - API Reference:
      - Documentation: api/reference.md
      - Modpack Controller: api/modpack.md
      - Core: api/engine.md
      - Entities:
          - Entity Protocols: api/entity/entities.md
          - Custom Behaviors: api/entity/behaviors.md
          - Entity Components: api/entity/components.md
      - Particles:
          - Examples: api/particle/examples.md
          - Particle System: api/particle/system.md
          - Particle Types: api/particle/particle_types.md
          - Particle Configurations: api/particle/configs.md
          - Available Presets: api/particle/presets.md
      - Types Definitions:
          - Color: api/types/color_types.md
          - Core and Geometry: api/types/core_types_geom.md
          - Graphical: api/types/graphic_types.md
          - Enums: api/types/enums.md
  - Privacy Policy: privacy.md
